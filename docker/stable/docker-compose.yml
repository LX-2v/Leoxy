# Name this Compose application.
name: leoxy

# Define the application containers.
services:
# Run Leoxy from the stable Dockerfile.
  leoxy:
    build:
      context: ../..
      dockerfile: docker/stable/Dockerfile
      args:
        LEOXY_VERSION: ${LEOXY_VERSION:-1.15.0}
    # Tag the built image with configurable image name and tag.
    image: ${LEOXY_IMAGE:-mohamed0699/leoxy}:${LEOXY_TAG:-latest}
    # Match the non-root account created in the image.
    user: "${LEOXY_UID:-10001}:${LEOXY_GID:-10001}"
    # Restart after failures or host restarts.
    restart: unless-stopped
    # Run a small init process to reap child processes.
    init: true
    # Publish the configurable host port to the container's HTTP port.
    ports:
      - "${LEOXY_PORT:-80}:80"
    # Configure the listener, memory limit, and optional authentication/storage secrets.
    environment:
      PORT: "80"
      LEOXY_HOST: 0.0.0.0
      GOMEMLIMIT: 400MiB
      API_KEYS: ${API_KEYS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Persist configuration and logs outside the container filesystem.
    volumes:
      - ./leoxy:/app/leoxy
      - leoxy-log:/app/log
    # Make the root filesystem read-only and provide temporary writable storage.
    read_only: true
    tmpfs:
      - /tmp
    # Apply container hardening and drop Linux capabilities.
    security_opt:
      - "no-new-privileges:true"
    # Drop all optional Linux capabilities.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    # Bound memory, process count, and open file descriptors.
    mem_limit: 512m
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    # Check that the local liveness endpoint responds successfully.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:$${PORT:-80}/health/live || exit 1",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Allow time for graceful shutdown.
    stop_grace_period: 15s
    # Rotate container logs to limit disk usage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Create persistent storage for application logs.
volumes:
  leoxy-log:
